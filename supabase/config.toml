project_id = "dogtrainer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.rate_limit]
# Lokalnie luźno, żeby testy e-maili (reset hasła, potwierdzenie) nie trafiały w limit.
email_sent = 1000

[storage]
enabled = true
file_size_limit = "50MiB"

[auth.mfa.totp]
# Weryfikacja dwuetapowa (TOTP) dla panelu właściciela /admin; na hostowanym Supabase jest domyślnie włączona.
enroll_enabled = true
verify_enabled = true
