project_id = "dogtrainer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false

# Wiadomości Supabase Auth (potwierdzenie konta, reset hasła) po polsku i angielsku wg języka z rejestracji (`user_metadata.locale`).
# Lokalnie działają od razu; na hostowanym Supabase wklej je w Authentication → Email Templates (instrukcja: docs/WDROZENIE-STAGING.md;
# NIE używaj `supabase config push`, bo wgrałby na zdalny projekt lokalne ustawienia Auth: adres localhost, brak potwierdzenia e-maila). Temat jest dwujęzyczny, bo szablon nie zna języka odbiorcy przy tworzeniu tematu.
[auth.email.template.confirmation]
subject = "Potwierdź konto w DogTrainer / Confirm your DogTrainer account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Nowe hasło w DogTrainer / Reset your DogTrainer password"
content_path = "./supabase/templates/recovery.html"

[auth.rate_limit]
# Lokalnie luźno, żeby testy e-maili (reset hasła, potwierdzenie) nie trafiały w limit.
email_sent = 1000

[storage]
enabled = true
file_size_limit = "50MiB"

[auth.mfa.totp]
# Weryfikacja dwuetapowa (TOTP) dla panelu właściciela /admin; na hostowanym Supabase jest domyślnie włączona.
enroll_enabled = true
verify_enabled = true
