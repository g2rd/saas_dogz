# Automatyczny code review przez Claude: każdy pull request dostaje przegląd z komentarzami w liniach kodu (skill `code-review`).
# Przepływ: Claude wypycha gałąź `feat/*` i otwiera PR do `dev`; ten workflow robi review; PR zatwierdza i scala wyłącznie właściciel.
# Wymaga sekretu repozytorium ANTHROPIC_API_KEY i zainstalowanej aplikacji Claude GitHub App.
# Review niczego nie blokuje, nie zatwierdza i nie scala; nie zastępuje testów (`npm run typecheck`, `test`, `db:test`...).
name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Nowy commit w PR-ze anuluje trwający przegląd tego PR-a (oszczędza minuty i tokeny)
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pull-request-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
