# Cotygodniowe propozycje aktualizacji zależności jako pull requesty (przechodzą CI i review jak każda zmiana).
# Aktualizacje poprawkowe i drobne łączymy w jeden PR, a duże wersje (zmiany łamiące zgodność) idą osobno.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
