<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <title>Brak połączenia | DogTrainer</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #ededed; }
        button { background: #ededed; color: #0a0a0a; }
      }
      main { max-width: 360px; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 12px; }
      p { line-height: 1.5; color: #52525b; margin: 0 0 24px; }
      @media (prefers-color-scheme: dark) { p { color: #a1a1aa; } }
      button {
        height: 44px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #171717;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brak połączenia</h1>
      <p>Nie udało się wczytać strony. Sprawdź internet i spróbuj ponownie. Twoje dane są bezpieczne na serwerze.</p>
      <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
    </main>
  </body>
</html>
